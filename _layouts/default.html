<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1HCHDEQSKE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1HCHDEQSKE');
  </script>

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muntasir Hossain's Portfolio</title>

  <title>{{ site.title | default: "Muntasir Hossain's Portfolio" }}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .page-wrapper {
      width: min(1020px, 85%);
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .profile {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      margin-bottom: 48px;
      padding-bottom: 36px;
      border-bottom: 1px solid #e5e7eb;
    }

    .profile-photo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .profile-text h1 {
      margin: 0 0 16px;
      font-size: 2.4rem;
      line-height: 1.2;
      color: #111827;
    }

    .profile-text p {
      margin-top: 0;
    }

    main {
      width: 100%;
    }

    h1,
    h2,
    h3,
    h4 {
      color: #111827;
      line-height: 1.3;
    }

    main h1 {
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 28px;
    }

    main h2 {
      font-size: 1.55rem;
      margin-top: 52px;
      padding-top: 28px;
      border-top: 1px solid #e5e7eb;
    }

    main h3 {
      margin-top: 20px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img,
    video,
    iframe,
    embed,
    object {
      max-width: 100%;
    }

    iframe {
      width: 100%;
      min-height: 760px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      margin: 20px 0;
    }

    code {
      background: #f3f4f6;
      padding: 2px 5px;
      border-radius: 4px;
    }

    pre {
      overflow-x: auto;
      background: #f3f4f6;
      padding: 16px;
      border-radius: 8px;
    }

    hr {
      border: 0;
      border-top: 1px solid #e5e7eb;
      margin: 40px 0;
    }

    footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 0.9rem;
    }

    @media screen and (max-width: 760px) {
      .page-wrapper {
        width: 94%;
        padding-top: 32px;
      }

      .profile {
        display: block;
      }

      .profile-photo {
        width: 130px;
        height: 130px;
        margin-bottom: 20px;
      }

      .profile-text h1 {
        font-size: 2rem;
      }

      iframe {
        min-height: 440px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <header class="profile">
      {% if site.logo %}
        <img
          src="{{ site.logo | relative_url }}"
          alt="{{ site.title }}"
          class="profile-photo">
      {% endif %}

      <div class="profile-text">
        <h1>{{ site.title }}</h1>

        {% if site.description %}
          <div class="profile-description">
            {{ site.description | markdownify }}
          </div>
        {% endif %}
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>Hosted with GitHub Pages.</p>
    </footer>

  </div>
</body>
</html>
